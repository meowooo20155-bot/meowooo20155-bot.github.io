# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Refreshes the encrypted statistics shown on GitHub Pages.
  schedule:
    - cron: '*/10 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          curl --fail --retry 3 --silent --show-error \
            https://sibgard-smart-plants.jekakharitonov.chatgpt.site/admin.js \
            -o _site/admin-core.js
          curl --fail --retry 3 --silent --show-error \
            https://sibgard-smart-plants.jekakharitonov.chatgpt.site/admin.css \
            -o _site/admin-core.css
          curl --fail --retry 3 --silent --show-error \
            https://sibgard-smart-plants.jekakharitonov.chatgpt.site/api/analytics/snapshot \
            -o _site/data/analytics.enc.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
